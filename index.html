<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torchcoin Health Check</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --panel: #1f2937;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --good: #22c55e;
        --bad: #ef4444;
        --warn: #f59e0b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 50%);
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.4rem;
        text-align: center;
      }

      .status-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 110px;
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .status-pill.online {
        background: rgba(34, 197, 94, 0.12);
        color: var(--good);
        border: 1px solid rgba(34, 197, 94, 0.4);
      }

      .status-pill.offline {
        background: rgba(239, 68, 68, 0.12);
        color: var(--bad);
        border: 1px solid rgba(239, 68, 68, 0.4);
      }

      .status-pill.checking {
        background: rgba(245, 158, 11, 0.12);
        color: var(--warn);
        border: 1px solid rgba(245, 158, 11, 0.4);
      }

      .meta {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .meta strong {
        color: var(--text);
      }

      .response {
        margin-top: 14px;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.8);
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #cbd5e1;
        font-size: 0.9rem;
        min-height: 44px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        font-size: 0.96rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Torchcoin Health</h1>

      <div class="status-box">
        <span>Service</span>
        <span id="status" class="status-pill checking">Checking…</span>
      </div>

      <div class="meta">
        <div><strong>URL:</strong> https://torchcoin.onrender.com/health</div>
        <div><strong>Last check:</strong> <span id="lastCheck">—</span></div>
      </div>

      <div id="response" class="response">Waiting for response…</div>

      <button id="checkBtn" type="button">Check now</button>
    </div>

    <script>
      const endpoint = "https://torchcoin.onrender.com/health";
      const statusEl = document.getElementById("status");
      const lastCheckEl = document.getElementById("lastCheck");
      const responseEl = document.getElementById("response");
      const checkBtn = document.getElementById("checkBtn");

      function setStatus(state) {
        statusEl.className = "status-pill";
        if (state === "online") {
          statusEl.textContent = "Online";
          statusEl.classList.add("online");
        } else if (state === "offline") {
          statusEl.textContent = "Offline";
          statusEl.classList.add("offline");
        } else {
          statusEl.textContent = "Checking…";
          statusEl.classList.add("checking");
        }
      }

      async function checkHealth() {
        checkBtn.disabled = true;
        setStatus("checking");
        responseEl.textContent = "Requesting health status…";

        try {
          const res = await fetch(endpoint, { cache: "no-store" });

          let data = null;
          try {
            data = await res.json();
          } catch (e) {
            data = null;
          }

          const okValue = data && (data.ok === true || data.ok === "ok" || data.ok === 1);

          if (!res.ok || !okValue) {
            throw new Error(
              data && Object.keys(data).length
                ? JSON.stringify(data, null, 2)
                : `HTTP ${res.status}`
            );
          }

          setStatus("online");
          responseEl.textContent = JSON.stringify(data, null, 2);
          lastCheckEl.textContent = new Date().toLocaleString();
        } catch (error) {
          setStatus("offline");
          responseEl.textContent = error?.message || "Request failed";
          lastCheckEl.textContent = new Date().toLocaleString();
        } finally {
          checkBtn.disabled = false;
        }
      }

      checkBtn.addEventListener("click", checkHealth);

      checkHealth();
      setInterval(checkHealth, 15000);
    </script>
  </body>
</html>
